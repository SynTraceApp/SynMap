<!doctype html><meta charset=utf-8><title>Play-ikon, källa</title><body style="margin:0;background:#171a23"><canvas id=c width=1024 height=1024></canvas><script>
const g=document.getElementById('c').getContext('2d'),W=1024,H=1024;
g.fillStyle='#171a23';g.fillRect(0,0,W,H);
function lens(P0,P1,peakT,peakLift,half,cols,al,ph){
  const N=120,pts=[];
  for(let j=0;j<=N;j++){
    const t=j/N, x=P0[0]+(P1[0]-P0[0])*t;
    const base=P0[1]+(P1[1]-P0[1])*t;
    const s=Math.sin(Math.PI*Math.pow(t,Math.log(.5)/Math.log(peakT)));
    const lift=peakLift*s;
    const w=half*Math.pow(s,.85)*(1+.12*Math.sin(t*5+ph));
    pts.push([x,base-lift,w]);
  }
  const grad=g.createLinearGradient(P0[0],0,P1[0],0);
  cols.forEach((c,i)=>grad.addColorStop(i/(cols.length-1),c));
  const edge=(k,j)=>[pts[j][0],pts[j][1]+(2*k-1)*pts[j][2]];
  // body
  g.save();g.filter='blur(16px)';g.globalAlpha=al*.9;g.fillStyle=grad;g.beginPath();
  for(let j=0;j<=N;j++){const [x,y]=edge(0,j);j?g.lineTo(x,y):g.moveTo(x,y);}
  for(let j=N;j>=0;j--){const [x,y]=edge(1,j);g.lineTo(x,y);}
  g.closePath();g.fill();g.restore();
  // strands
  g.save();g.strokeStyle=grad;g.lineWidth=2.4;g.globalAlpha=al;
  const M=64;
  for(let i=0;i<=M;i++){const k=i/M;g.beginPath();for(let j=0;j<=N;j++){const [x,y]=edge(k,j);j?g.lineTo(x,y):g.moveTo(x,y);}g.stroke();}
  g.restore();
}
// B first (below): ochre -> orange -> pink
lens([-20,990],[1044,690],.42,300,290,["#7fcf9a","#cfc76e","#f2d26c","#f0a574","#ec8fa0"],.5,1.4);
// A on top: blue -> teal
lens([-20,570],[1044,480],.46,190,215,["#5a78e0","#5a96e8","#4fbfc0","#7fd0a8"],.55,.3);
</script></body>
